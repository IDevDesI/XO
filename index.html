<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X O Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --cell: #334155;
      --cell-hover: #475569;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --x: #38bdf8;
      --o: #f472b6;
      --win: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .game {
      width: min(92vw, 420px);
      padding: 24px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      letter-spacing: 2px;
    }
    h1 .x { color: var(--x); }
    h1 .o { color: var(--o); }

    .mode {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    select, .action {
      font: inherit;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    select {
      background: var(--cell);
      color: var(--text);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .score {
      padding: 8px;
      border-radius: 10px;
      background: var(--cell);
      outline: 2px solid transparent;
      transition: outline-color 0.2s;
    }
    .score span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .score strong { font-size: 1.5rem; }
    .score.x { color: var(--x); }
    .score.o { color: var(--o); }
    .score.active { outline-color: currentColor; }

    .status {
      min-height: 1.5em;
      margin: 0 0 16px;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      aspect-ratio: 1;
    }
    .cell {
      border: none;
      border-radius: 12px;
      background: var(--cell);
      color: var(--text);
      font-size: clamp(2.5rem, 14vw, 4.5rem);
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cell:hover:not(:disabled) { background: var(--cell-hover); }
    .cell:disabled { cursor: default; }
    .cell.x, .cell.o { animation: pop 0.2s ease-out; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      background: var(--win);
      color: var(--bg);
    }

    @keyframes pop {
      from { transform: scale(0.5); }
      to { transform: scale(1); }
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .action {
      flex: 1;
      background: var(--x);
      color: var(--bg);
      font-weight: 700;
    }
    .action.secondary {
      background: var(--cell);
      color: var(--text);
    }
    .action:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="game">
    <h1><span class="x">X</span> <span class="o">O</span> Game</h1>

    <label class="mode">
      Mode
      <select id="mode">
        <option value="pvp">2 Players</option>
        <option value="easy">vs Computer (Easy)</option>
        <option value="medium">vs Computer (Medium)</option>
        <option value="hard">vs Computer (Hard)</option>
      </select>
    </label>

    <div class="scoreboard">
      <div class="score x" id="box-x"><span id="label-x">Player X</span><strong id="score-x">0</strong></div>
      <div class="score"><span>Draws</span><strong id="score-draw">0</strong></div>
      <div class="score o" id="box-o"><span id="label-o">Player O</span><strong id="score-o">0</strong></div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="board" class="board"></div>

    <div class="actions">
      <button id="new-round" class="action">New Round</button>
      <button id="reset" class="action secondary">Reset Scores</button>
    </div>
  </main>

  <script>
    const LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6],
    ];
    const HUMAN = 'X';
    const COMPUTER = 'O';
    const COMPUTER_DELAY_MS = 400;
    // Probability the computer plays the best move instead of a random one.
    const SMART_MOVE_CHANCE = { easy: 0, medium: 0.6, hard: 1 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const modeEl = document.getElementById('mode');
    const scoreEls = {
      X: document.getElementById('score-x'),
      O: document.getElementById('score-o'),
      draw: document.getElementById('score-draw'),
    };
    const labelEls = { X: document.getElementById('label-x'), O: document.getElementById('label-o') };
    const boxEls = { X: document.getElementById('box-x'), O: document.getElementById('box-o') };

    let board = Array(9).fill(null);
    let current = 'X';
    let starter = 'X';
    let gameOver = false;
    let computerTimer = null;
    let scores = { X: 0, O: 0, draw: 0 };

    const cells = Array.from({ length: 9 }, (_, i) => {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.setAttribute('aria-label', `Cell ${i + 1}`);
      cell.addEventListener('click', () => handleCellClick(i));
      boardEl.appendChild(cell);
      return cell;
    });

    const other = (player) => (player === 'X' ? 'O' : 'X');
    const emptyCells = (squares) => squares.flatMap((mark, i) => (mark ? [] : [i]));
    const vsComputer = () => modeEl.value !== 'pvp';
    const isComputerTurn = () => vsComputer() && current === COMPUTER && !gameOver;

    function getWinner(squares) {
      for (const line of LINES) {
        const [a, b, c] = line;
        if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
          return { player: squares[a], line };
        }
      }
      return null;
    }

    function handleCellClick(i) {
      if (gameOver || board[i] || isComputerTurn()) return;
      play(i);
    }

    function play(i) {
      board[i] = current;
      const result = getWinner(board);
      if (result) {
        gameOver = true;
        scores[result.player]++;
      } else if (emptyCells(board).length === 0) {
        gameOver = true;
        scores.draw++;
      } else {
        current = other(current);
      }
      render();
      if (isComputerTurn()) scheduleComputerMove();
    }

    function scheduleComputerMove() {
      computerTimer = setTimeout(() => {
        computerTimer = null;
        play(chooseComputerMove());
      }, COMPUTER_DELAY_MS);
    }

    function chooseComputerMove() {
      if (Math.random() < SMART_MOVE_CHANCE[modeEl.value]) {
        return minimax(board.slice(), COMPUTER, 0).index;
      }
      const empty = emptyCells(board);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    // Scores favour faster wins and slower losses via depth.
    function minimax(squares, player, depth) {
      const result = getWinner(squares);
      if (result) return { score: result.player === COMPUTER ? 10 - depth : depth - 10 };

      const empty = emptyCells(squares);
      if (empty.length === 0) return { score: 0 };

      const maximizing = player === COMPUTER;
      let best = { score: maximizing ? -Infinity : Infinity };
      for (const i of empty) {
        squares[i] = player;
        const { score } = minimax(squares, other(player), depth + 1);
        squares[i] = null;
        if (maximizing ? score > best.score : score < best.score) {
          best = { score, index: i };
        }
      }
      return best;
    }

    function statusText(result) {
      if (result) {
        if (!vsComputer()) return `Player ${result.player} wins!`;
        return result.player === HUMAN ? 'You win!' : 'Computer wins!';
      }
      if (gameOver) return "It's a draw!";
      if (!vsComputer()) return `Player ${current}'s turn`;
      return current === HUMAN ? 'Your turn' : 'Computer is thinking…';
    }

    function render() {
      const result = getWinner(board);
      const waiting = isComputerTurn();

      cells.forEach((cell, i) => {
        const mark = board[i];
        cell.textContent = mark || '';
        cell.classList.toggle('x', mark === 'X');
        cell.classList.toggle('o', mark === 'O');
        cell.classList.toggle('win', Boolean(result && result.line.includes(i)));
        cell.disabled = Boolean(mark) || gameOver || waiting;
      });

      statusEl.textContent = statusText(result);

      labelEls.X.textContent = vsComputer() ? 'You (X)' : 'Player X';
      labelEls.O.textContent = vsComputer() ? 'Computer (O)' : 'Player O';
      for (const key of Object.keys(scoreEls)) scoreEls[key].textContent = scores[key];
      for (const player of ['X', 'O']) {
        boxEls[player].classList.toggle('active', !gameOver && current === player);
      }
    }

    function newRound() {
      clearTimeout(computerTimer);
      computerTimer = null;
      board = Array(9).fill(null);
      current = starter;
      starter = other(starter); // alternate who goes first each round
      gameOver = false;
      render();
      if (isComputerTurn()) scheduleComputerMove();
    }

    function resetGame() {
      scores = { X: 0, O: 0, draw: 0 };
      starter = 'X';
      newRound();
    }

    document.getElementById('new-round').addEventListener('click', newRound);
    document.getElementById('reset').addEventListener('click', resetGame);
    modeEl.addEventListener('change', resetGame);

    resetGame();
  </script>
</body>
</html>
